<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Roster</title>
<style>
:root{--bg:#f4f5fb;--c:#fff;--t:#1a1b2e;--m:#6b7080;--b:#e4e6f0;--a:#5f52ff;--ab:#5f52ff;--ad:#2a2380;--at:#eeedff;--g:#15803d;--gb:#dcfce7;--w:#b45309;--wb:#fef3c7;--r:#dc2626;--rb:#fee2e2;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1016;--c:#181a24;--t:#ecedf5;--m:#9a9db0;--b:#2a2d3d;--a:#9a90ff;--ab:#6a5cff;--ad:#1b1740;--at:#241f4d;--g:#4ade80;--gb:#14351f;--w:#fbbf24;--wb:#3a2d0c;--r:#f87171;--rb:#3b1515}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:780px;margin:auto;padding:12px}input,select,button,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px 11px}
button{cursor:pointer}button.p{background:var(--ab);border-color:var(--ab);color:#fff;font-weight:600}button:disabled{opacity:.4}
.hd{background:linear-gradient(135deg,var(--ad),#4338ca);color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hd h1{margin:0;font-size:22px;letter-spacing:.3px}.bt{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.75}.sub{font-size:13px;opacity:.85}.hr{text-align:right;font-size:13px}
.hd button{background:#ffffff22;border:1px solid #ffffff44;color:#fff;padding:5px 10px;margin:4px 0 0 4px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}.me{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset;background:var(--at)}
.s{color:var(--m);font-size:13px}.bd{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;margin-left:6px;background:var(--b)}
.on{background:var(--gb);color:var(--g)}.lv{background:var(--wb);color:var(--w)}
.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.box{background:var(--c);border-radius:16px;padding:18px;max-width:440px;width:100%}.urg{border-left:5px solid var(--r)}#err{color:var(--r);font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}.tabs button{border-radius:99px}
.strip{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.dchip{display:flex;flex-direction:column;align-items:center;min-width:48px;padding:6px 8px;border-radius:12px}.dchip small{font-size:11px;color:var(--m)}.dchip b{font-size:16px}.dchip.sel{background:var(--ab);border-color:var(--ab);color:#fff}.dchip.sel small{color:#fff}
.yd{background:linear-gradient(135deg,var(--ab),var(--ad));color:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}.yd .big{font-size:19px;font-weight:700}.yd .s2{font-size:13px;opacity:.85}.yd button{background:#fff;color:var(--ad);border:0;font-weight:700;padding:10px 18px}
.mc{display:flex;gap:12px}.tm{min-width:60px;font-weight:700;font-size:18px;text-align:center}.ic{font-size:22px;margin-top:4px}.bdy{flex:1;min-width:0}.ttl{font-weight:700}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--b);font-weight:600}.pill.l{background:var(--at);color:var(--a)}.pill.h{background:#c026d3;color:#fff}.pill.o{background:#84b36b;color:#10240a}.pill.s2{background:var(--gb);color:var(--g)}
.ppl{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}.chip{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--b)}.chip.me{background:var(--ab);color:#fff;font-weight:600}
.tb{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed;font-size:13px}.tb td,.tb th{word-wrap:break-word}.tb th{background:#facc15;color:#000;padding:6px;border:1px solid var(--b);text-align:left;white-space:nowrap}.tb td{padding:6px;border:1px solid var(--b);vertical-align:top}.tb tr.mr td{background:var(--at)}.tb td.wh{background:#c026d3;color:#fff}.tb td.wo{background:#84b36b;color:#000}
.dt{display:block;width:6px;height:6px;border-radius:50%;background:var(--g);margin-top:2px}.dchip.sel .dt{background:#fff}
</style></head><body><main id="app"></main><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
window.onerror=(m,u,l)=>{document.body.insertAdjacentHTML('afterbegin','<pre style="color:#b91c1c;white-space:pre-wrap;padding:12px;font-size:14px">Error: '+m+' (line '+l+')</pre>')};
window.onunhandledrejection=e=>window.onerror(String(e.reason&&e.reason.message||e.reason));
if(typeof supabase==='undefined')throw new Error('The Supabase library did not load. Your network may be blocking cdn.jsdelivr.net');
const URL_='https://mapvhiijlftmqiwljfnt.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hcHZoaWlqbGZ0bXFpd2xqZm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0OTAwNjYsImV4cCI6MjEwOTA2NjA2Nn0.p4cI9Uof6wazR7w2JFQhcBHqr08rXWlPvR3VMXMssVk', SHIFT_LEN=510; // minutes, used when no end time is given
const sb=supabase.createClient(URL_,KEY), $=id=>document.getElementById(id), pad=n=>(n<10?'0':'')+n;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), TODAY=()=>iso(new Date());
const rt=v=>/^0\.\d+$/.test(v)?hm(Math.round(v*1440)):v;
const mt=v=>/^0\.\d+$/.test(v)?hm(Math.round(v*1440)):v;
const hm=m=>m==null?'':pad(Math.floor(m/60)%24)+':'+pad(m%60);
let me=null,emps=[],rows=[],att={},notices=[],notifs=[],day=TODAY(),team='',mine=localStorage.mine==='1',view=localStorage.view||(innerWidth<700?'cards':'table'),tab='day',prev=null;
const staff=()=>me&&['admin','lead'].includes(me.role);
const err=t=>{const e=$('err');if(e)e.textContent=t||''};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const {data}=await sb.from('employees').select('*').order('name');emps=data||[];
  if(session){me=emps.find(e=>e.user_id===session.user.id);if(me)return load()}
  loginView();
}
function loginView(){
  $('app').innerHTML=`<div class="hd"><div><h1>Team Roster</h1><div class="sub">Sign in to see your schedule</div></div></div><div class="row" style="margin-top:12px"><div class="bar"><select id="who">${emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>
  <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="6-digit PIN"></div>
  <div class="bar"><button class="p" id="li">Log in</button><button id="reg">First time? Set my PIN</button></div><div id="err"></div></div>`;
  const cred=()=>({email:$('who').value+'@gmail.com',password:$('pin').value});
  $('li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());error?err('Wrong name or PIN.'):boot()};
  $('reg').onclick=async()=>{const c=cred();if(!/^\d{6}$/.test(c.password))return err('PIN must be 6 digits.');
    const {error}=await sb.auth.signUp(c);if(error)return err('Could not set PIN: '+error.message+' (if you already set a PIN, use Log in)');
    const r=await sb.rpc('claim_employee',{eid:$('who').value});r.error?err(r.error.message):boot()};
}
async function pageRows(){let all=[],p=0;const from=iso(new Date(Date.now()-90*864e5));
  for(;;){const x=await sb.from('assignments').select('*').gte('d',from).order('d').order('id').range(p,p+999);if(x.error||!x.data)break;all=all.concat(x.data);if(x.data.length<1000)break;p+=1000}
  return {data:all}}
async function load(){
  const [a,n,t,f]=await Promise.all([pageRows(),sb.from('notices').select('*'),sb.from('attendance').select('*'),sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100)]);
  rows=a.data||[];notices=n.data||[];notifs=f.data||[];att={};(t.data||[]).forEach(x=>att[x.employee_id+'|'+x.d]=x);
  render();showNotices();
}
function days(){ // group assignments into person-days
  const m={};rows.forEach(r=>{const k=r.d+'|'+(r.employee_id||r.person_raw)+'|'+r.team;(m[k]=m[k]||{d:r.d,emp:r.employee_id,name:r.person_raw,team:r.team,items:[]}).items.push(r)});
  return Object.values(m).map(p=>{const w=p.items.filter(i=>i.kind!=='leave'&&i.start_min!=null);p.leave=p.items.some(i=>i.kind==='leave');
    if(w.length){const f=w.reduce((a,b)=>b.start_min<a.start_min?b:a);p.s=f.start_min;p.e=f.end_min;p.shift=p.s<420?1:p.e>1440?3:2}return p});
}
function render(){
  const teams=[...new Set(rows.map(r=>r.team))],all=days(),my=tab==='my'||mine,M={},L=new Set(),NT=new Set();
  rows.filter(r=>(tab==='my'?r.d>=TODAY():r.d===day)&&(!team||r.team===team)).forEach(r=>{
    const E=r.employee_id?emps.find(e=>e.id===r.employee_id):null,n=E?E.name:r.person_raw+' (unmatched)',sn=E?(E.short_name||E.name).split(',')[0].trim():r.person_raw+'?';
    if(r.kind==='note'){NT.add(r.person_raw);return}
    if(r.kind==='leave'){L.add(n);return}
    const k=r.d+'|'+r.team+'|'+r.row_no+'|'+r.series,q=M[k]=M[k]||{d:r.d,team:r.team,series:r.series,mn:r.match_no,cov:r.coverage,t:r.match_time,rep:r.reporting,wf:r.work_from,cm:r.comment,kind:'rank',sc:[],rk:[],s:null,e:null};
    if(r.kind==='rank'){if(!q.rk.some(x=>x.n===n))q.rk.push({id:r.employee_id,n,sn})}
    else{q.kind=r.kind;if(!q.sc.some(x=>x.n===n))q.sc.push({id:r.employee_id,n,sn});if(r.start_min!=null){q.s=q.s==null?r.start_min:Math.min(q.s,r.start_min);q.e=Math.max(q.e||0,r.end_min||0)}}});
  const ms=Object.values(M).filter(q=>!my||q.sc.concat(q.rk).some(x=>x.id===me.id)).sort((a,b)=>a.d.localeCompare(b.d)||(a.s??9999)-(b.s??9999));
  const nl=(a,f='n')=>a.map(x=>x.id===me.id?'<b style="color:var(--a)">'+esc(x[f])+'</b>':esc(x[f])).join(', ');
  const chips=a=>a.map(x=>`<span class="chip ${x.id===me.id?'me':''}">${esc(x.n)}</span>`).join('');
  const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()},dur=m=>m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';
  const icon=q=>({support:'🎧',sanitary:'🧼',qc:'✅',normal:'🕘'})[q.kind]||(/moto/i.test(q.series)?'🏍️':/f1|formula|grand prix/i.test(q.series)?'🏎️':/boxing/i.test(q.series)?'🥊':/chess/i.test(q.series)?'♟️':/darts/i.test(q.series)?'🎯':/cycl/i.test(q.series)?'🚴':/horse/i.test(q.series)?'🏇':/volley/i.test(q.series)?'🏐':'🏏');
  const card=q=>{const mi=q.sc.concat(q.rk).some(x=>x.id===me.id),lab={support:'Assigned',sanitary:'Assigned',normal:'Normal shift',qc:'QC'}[q.kind]||'Scoring';
    const st=q.d===TODAY()&&q.kind==='match'&&q.s!=null?(nowM()<q.s?'Starts in '+dur(q.s-nowM()):nowM()<=q.e?'Started':''):'';
    return `<div class="row mc ${mi?'me':''}"><div class="tm">${esc(mt(q.t||'')||'—')}<div class="ic">${icon(q)}</div></div><div class="bdy">${tab==='my'?'<div class="s">'+wd(q.d)+'</div>':''}
    <div class="ttl">${esc(q.series)}${q.mn?' <span class="s">· Match '+esc(q.mn)+'</span>':''}${q.kind!=='match'?' <span class="bd">'+esc(q.kind.toUpperCase())+'</span>':''}</div>
    <div class="meta">${q.cov?'<span class="pill l">Level '+esc(q.cov)+'</span>':''}${q.wf?'<span class="pill '+(/home/i.test(q.wf)?'h':/office/i.test(q.wf)?'o':'')+'">'+esc(q.wf)+'</span>':''}${q.rep&&q.rep!=='-'?'<span class="s">Report '+esc(rt(q.rep))+'</span>':''}${st?'<span class="pill s2">'+st+'</span>':''}${teams.length>1?'<span class="s">'+esc(q.team)+'</span>':''}</div>
    <div class="ppl"><span class="s">${lab}</span>${chips(q.sc)||'—'}</div>${q.rk.length?'<div class="ppl"><span class="s">Rankings update</span>'+chips(q.rk)+'</div>':''}${q.cm?'<div class="s">'+esc(q.cm)+'</div>':''}</div></div>`};
  const mp=tab==='day'?all.find(p=>p.emp===me.id&&p.d===day&&(!team||p.team===team)):null,a=mp&&att[me.id+'|'+day];
  const du=mp?[...new Set(mp.items.filter(i=>['rank','support','sanitary'].includes(i.kind)).map(i=>({rank:'Rankings update',support:'Client support',sanitary:'Sanitary checks'}[i.kind])))]:[];
  const since=a?.login_at?' · In at '+hm(new Date(a.login_at).getHours()*60+new Date(a.login_at).getMinutes()):'',outAt=a?.logout_at?' · Out at '+hm(new Date(a.logout_at).getHours()*60+new Date(a.logout_at).getMinutes()):'';
  const dayCard=mp?`<div class="yd"><div><div class="s2">Your day</div><div class="big">${mp.s!=null?'Shift '+mp.shift+' · '+hm(mp.s)+'–'+hm(mp.e):mp.leave?'On leave':esc(du.join(', '))+' duty'}</div><div class="s2">${mp.s!=null&&du.length?'+ '+esc(du.join(', ')):''}${since}${outAt}</div></div>${day===TODAY()&&mp.s!=null&&!a?.logout_at?'<button data-a="'+(a?.login_at?'out':'in')+'" data-d="'+day+'">'+(a?.login_at?'Log out':'Log in')+'</button>':''}</div>`:'';
  const on=Object.values(att).filter(x=>x.d===day&&x.login_at&&!x.logout_at).length;
  const tbl=()=>`<div style="overflow-x:auto"><table class="tb"><colgroup><col style="width:70px"><col style="width:90px"><col style="width:20%"><col style="width:80px"><col style="width:50px"><col><col style="width:16%"><col style="width:110px"><col style="width:80px"></colgroup><tr><th>Match Time</th><th>Reporting</th><th>Series</th><th>Match No.</th><th>Level</th><th>Scorers / Assigned</th><th>Comment</th><th>Rankings Update</th><th>Work From</th></tr>${ms.map(q=>`<tr class="${q.sc.concat(q.rk).some(x=>x.id===me.id)?'mr':''}"><td>${esc(mt(q.t||''))}</td><td>${q.rep&&q.rep!=='-'?esc(rt(q.rep)):'-'}</td><td><b>${esc(q.series)}</b></td><td>${esc(q.mn)}</td><td>${esc(q.cov)}</td><td>${nl(q.sc,'sn')}</td><td>${esc(q.cm)}</td><td>${nl(q.rk,'sn')}</td><td class="${/home/i.test(q.wf)?'wh':/office/i.test(q.wf)?'wo':''}">${esc(q.wf)}</td></tr>`).join('')}</table></div>`;
  const pub=new Set(rows.filter(r=>!team||r.team===team).map(r=>r.d)),strip=tab==='day'?`<div class="strip">${[-3,-2,-1,0,1,2,3].map(n=>{const d=new Date(day+'T00:00');d.setDate(d.getDate()+n);return `<button class="dchip ${n===0?'sel':''}" data-ds="${iso(d)}"><small>${d.toLocaleDateString([],{weekday:'short'})}</small><b>${d.getDate()}</b>${pub.has(iso(d))?'<i class="dt"></i>':''}</button>`}).join('')}</div>`:'';
  $('app').innerHTML=`<div class="hd"><div><h1>Team Roster</h1><div class="sub">${new Date((tab==='day'?day:TODAY())+'T00:00').toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · <span id="clk"></span></div></div>
  <div class="hr">${esc(me.name)} · ${me.role}<div><button id="bell">🔔${unread()?' <b>'+unread()+'</b>':''}</button><button id="cp">Change PIN</button><button id="out">Sign out</button></div></div></div>
  <div class="tabs"><button id="t1" class="${tab==='day'?'p':''}">Day roster</button><button id="t2" class="${tab==='my'?'p':''}">My shifts</button>${staff()?`<button id="t3" class="${tab==='mng'?'p':''}">Manage</button>`:''}${me.role==='admin'?`<button id="t4" class="${tab==='att'?'p':''}">Attendance</button>`:''}</div>
  ${tab==='att'?'<div id="attbox" class="s">Loading…</div>':tab==='mng'?manage():`${strip}<div class="bar">${tab==='day'?`<input type="date" id="dp" value="${day}"><button id="td">Today</button><label><input type="checkbox" id="mn" ${mine?'checked':''}> Only my matches</label> <button id="vw">${view==='table'?'Cards view':'Table view'}</button>`:''}<select id="tm"><option value="">All teams</option>${teams.map(t=>`<option ${t===team?'selected':''}>${esc(t)}</option>`).join('')}</select>
  ${tab==='day'?`<span class="s">${ms.length} matches${me.role==='admin'?' · '+on+' working now':''}</span>`:''}</div><div id="err"></div>${tab==='my'?'':''}${tab==='day'&&NT.size?'<div class="row urg"><b>📌 Note for the day</b>'+[...NT].map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>':''}${dayCard}${tab==='day'?'':nextBanner(all)}${tab==='day'&&view==='table'&&ms.length?tbl():(ms.map(card).join('')||'<div class="s">Nothing rostered.</div>')}${tab==='day'&&L.size?'<div class="row"><b>On leave</b><div class="ppl">'+[...L].map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div></div>':''}`}`;
  const g=id=>$(id);g('bell').onclick=()=>bellPanel();g('cp').onclick=changePin;g('out').onclick=async()=>{await sb.auth.signOut();me=null;boot()};
  g('t1').onclick=()=>{tab='day';render()};g('t2').onclick=()=>{tab='my';render()};if(g('t3'))g('t3').onclick=()=>{tab='mng';render()};if(g('t4'))g('t4').onclick=()=>{tab='att';render()};
  if(g('tm'))g('tm').onchange=e=>{team=e.target.value;render()};if(g('vw'))g('vw').onclick=()=>{view=view==='table'?'cards':'table';localStorage.view=view;render()};
  if(g('dp')){g('dp').onchange=e=>{if(e.target.value){day=e.target.value;render()}};g('mn').onchange=e=>{mine=e.target.checked;localStorage.mine=mine?'1':'0';render()};g('td').onclick=()=>{day=TODAY();render()}}
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{day=b.dataset.ds;render()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>punch(b.dataset.a,b.dataset.d));
  $('app').style.maxWidth=(tab==='day'&&view==='table')||tab==='att'?'1250px':'780px';tickClk();
  if(tab==='mng')wireManage();if(tab==='att')attLoad();
}
const tickClk=()=>{const c=$('clk');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};setInterval(tickClk,1000);
async function punch(a,d){
  const k=me.id+'|'+d,now=new Date().toISOString();
  const {error}=a==='in'?await sb.from('attendance').insert({employee_id:me.id,d,login_at:now}):await sb.from('attendance').update({logout_at:now}).eq('employee_id',me.id).eq('d',d);
  if(error)return err(error.message);
  const x=await sb.from('attendance').select('*').eq('employee_id',me.id).eq('d',d).single();att[k]=x.data||{employee_id:me.id,d,login_at:now};render();
  if(a==='out')timesheet(att[k]);
}
function timesheet(o){
  $('modal').innerHTML=`<div class="mod"><div class="box"><h3>Update your timesheets</h3><p>Before you leave, please update today’s hours in both:</p>
  <label><input type="checkbox" id="c1"> Darwin updated</label><br><label><input type="checkbox" id="c2"> Zoho timesheet updated</label>
  <div class="bar"><button class="p" id="ok" disabled>Done</button></div></div></div>`;
  const chk=()=>$('ok').disabled=!($('c1').checked&&$('c2').checked);$('c1').onchange=chk;$('c2').onchange=chk;
  $('ok').onclick=async()=>{o.ts_darwin=o.ts_zoho=true;await sb.from('attendance').update({ts_darwin:true,ts_zoho:true}).eq('employee_id',o.employee_id).eq('d',o.d);$('modal').innerHTML=''};
}

  $('modal').innerHTML=`<div class="mod"><div class="box"><h3>Roster saved</h3><div class="s">${out.length} entries for ${ds.length} date(s)</div>${ne?'<div class="s" style="color:var(--r)">Notifications were not sent: '+esc(ne)+'</div>':''}<p class="s">Message for your WhatsApp group:</p><textarea id="wam" rows="7" style="width:100%" readonly>${esc(msg)}</textarea><div class="bar"><button class="p" id="wac">Copy message</button><button id="wax">Close</button></div></div></div>`;
  $('wac').onclick=async()=>{try{await navigator.clipboard.writeText(msg);$('wac').textContent='Copied ✓'}catch(e){$('wam').select()}};$('wax').onclick=()=>{$('modal').innerHTML=''}}
function changePin(){
  const pi=(id,ph)=>`<input id="${id}" type="password" inputmode="numeric" maxlength="6" placeholder="${ph}">`;
  $('modal').innerHTML=`<div class="mod"><div class="box"><h3>Change PIN</h3><div class="bar">${pi('p0','Current PIN')}</div><div class="bar">${pi('p1','New 6-digit PIN')}${pi('p2','Repeat new PIN')}</div><div id="perr" class="s" style="color:var(--r)"></div><div class="bar"><button class="p" id="pok">Save</button><button id="pcx">Cancel</button></div></div></div>`;
  const e=t=>$('perr').textContent=t;$('pcx').onclick=()=>$('modal').innerHTML='';
  $('pok').onclick=async()=>{const b=$('p1').value;if(!/^\d{6}$/.test(b))return e('New PIN must be 6 digits.');if(b!==$('p2').value)return e('The two new PINs do not match.');
    let x=await sb.auth.signInWithPassword({email:me.id+'@gmail.com',password:$('p0').value});if(x.error)return e('Current PIN is wrong.');
    x=await sb.auth.updateUser({password:b});if(x.error)return e(x.error.message);$('modal').innerHTML='<div class="mod"><div class="box"><h3>PIN changed</h3><button class="p" id="px">OK</button></div></div>';$('px').onclick=()=>$('modal').innerHTML=''}}
setInterval(async()=>{if(!me)return;const f=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100);
  if(f.data&&f.data.length&&f.data[0].id!==(notifs[0]||{}).id){notifs=f.data;if(tab!=='mng'){render();if(!$('modal').innerHTML)unreadPopup()}}},60000);
boot();
</script></body></html>
