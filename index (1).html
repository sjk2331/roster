<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif}

<script>

const URL_='https://mapvhiijlftmqiwljfnt.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hcHZoaWlqbGZ0bXFpd2xqZm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0OTAwNjYsImV4cCI6MjEwOTA2NjA2Nn0.p4cI9Uof6wazR7w2JFQhcBHqr08rXWlPvR3VMXMssVk', SHIFT_LEN=510; // minutes, used when no end time is given

const err=t=>{const e=$('err');if(e)e.textContent=t||''};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const {data}=await sb.from('employees').select('*').order('name');emps=data||[];

function loginView(){
  $('app').innerHTML=`<h2>Team Roster</h2><div class="row"><div class="bar"><select id="who">${emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>

  $('li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());error?err('Wrong name or PIN.'):boot()};
  $('reg').onclick=async()=>{const c=cred();if(!/^\d{6}$/.test(c.password))return err('PIN must be 6 digits.');

async function load(){
  const [a,n,t,f]=await Promise.all([sb.from('assignments').select('*').order('d'),sb.from('notices').select('*'),sb.from('attendance').select('*'),sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100)]);

}
function days(){ // group assignments into person-days
  const m={};rows.forEach(r=>{const k=r.d+'|'+(r.employee_id||r.person_raw)+'|'+r.team;(m[k]=m[k]||{d:r.d,emp:r.employee_id,name:r.person_raw,team:r.team,items:[]}).items.push(r)});
  return Object.values(m).map(p=>{const w=p.items.filter(i=>i.kind!=='leave'&&i.start_min!=null);p.leave=p.items.some(i=>i.kind==='leave');
    if(w.length){p.s=Math.min(...w.map(i=>i.start_min));p.e=Math.max(...w.map(i=>i.end_min));p.shift=p.s<420?1:p.e>1440?3:2}return p});
}
function render(){
  const all=days(),teams=[...new Set(rows.map(r=>r.team))];
  const list=all.filter(p=>(tab==='my'?p.emp===me.id&&p.d>=TODAY():p.d===day)&&(!team||p.team===team)&&(!mine||p.emp===me.id));

    return `<div class="row ${mi?'me':''}"><b>${esc(nm(p))}</b>${p.leave&&!it.length?'<span class="bd lv">Leave</span>':`<span class="bd">Shift ${p.shift}</span>`}

    ${mi&&p.d===TODAY()&&!a?.logout_at?`<div class="bar"><button class="p" data-a="${a?.login_at?'out':'in'}" data-d="${p.d}">${a?.login_at?'Log out':'Log in'}</button></div>`:''}</div>`}).join('')||'<div class="s">Nothing rostered.</div>'}`}`;
  const g=id=>$(id);g('bell').onclick=()=>bellPanel();g('out').onclick=async()=>{await sb.auth.signOut();me=null;boot()};
  g('t1').onclick=()=>{tab='day';render()};g('t2').onclick=()=>{tab='my';render()};if(g('t3'))g('t3').onclick=()=>{tab='mng';render()};
  if(g('tm'))g('tm').onchange=e=>{team=e.target.value;render()};if(g('dp')){g('dp').onchange=e=>{day=e.target.value;render()};g('mn').onchange=e=>{mine=e.target.checked;render()};g('td').onclick=()=>{day=TODAY();render()};
    const sh=n=>{const d=new Date(day+'T00:00');d.setDate(d.getDate()+n);day=iso(d);render()};g('pv').onclick=()=>sh(-1);g('nx').onclick=()=>sh(1)}
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>punch(b.dataset.a,b.dataset.d));
  if(tab==='mng')wireManage();
}
async function punch(a,d){
  const k=me.id+'|'+d,now=new Date().toISOString(),o=att[k]||{employee_id:me.id,d};
  if(a==='in')o.login_at=now;else o.logout_at=now;
  const {error}=await sb.from('attendance').upsert(o);if(error)return err(error.message);att[k]=o;render();
  if(a==='out')timesheet(o);
}
function timesheet(o){
  $('modal').innerHTML=`<div class="mod"><div class="box"><h3>Update your timesheets</h3><p>Before you leave, please update today’s hours in both:</p>
  <label><input type="checkbox" id="c1"> Darwin updated</label><br><label><input type="checkbox" id="c2"> Zoho timesheet updated</label>
  <div class="bar"><button class="p" id="ok" disabled>Done</button></div></div></div>`;
  const chk=()=>$('ok').disabled=!($('c1').checked&&$('c2').checked);$('c1').onchange=chk;$('c2').onchange=chk;
  $('ok').onclick=async()=>{o.ts_darwin=o.ts_zoho=true;await sb.from('attendance').upsert(o);$('modal').innerHTML=''};
}
function showNotices(){
  const t=TODAY(),q=notices.filter(n=>n.date_from<=t&&t<=n.date_to&&(!n.team||n.team===me.team)&&!localStorage['ack'+n.id+t]);
  q.sort((a,b)=>b.urgent-a.urgent);const next=()=>{const n=q.shift();if(!n){unreadPopup();return}
    $('modal').innerHTML=`<div class="mod"><div class="box ${n.urgent?'urg':''}"><h3>${n.urgent?'⚠ Priority reminder':'Reminder'}</h3><p>${esc(n.body)}</p><button class="p" id="gt">Got it</button></div></div>`;
    $('gt').onclick=()=>{localStorage['ack'+n.id+t]=1;next()}};next();
}
function manage(){return `<div class="row"><h3>Upload daily roster (Excel)</h3><div class="bar"><input id="tn" placeholder="Team (e.g. Cricket, Tagging)" value="Cricket"><input type="file" id="fl" accept=".xlsx,.xls"></div>
  <div id="pv2" class="s"></div><label><input type="checkbox" id="nn" checked> Notify employees</label> <button class="p" id="sv" disabled>Save to dashboard</button><div class="s">Re-uploading a date replaces that date for that team. Log in/out records are kept.</div></div>
  <div class="row"><h3>Add reminder</h3><div class="bar"><input type="date" id="nf"><input type="date" id="nt"><select id="nteam"><option value="">Everyone</option>${[...new Set(emps.map(e=>e.team))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><label><input type="checkbox" id="nu"> Priority</label></div>
  <textarea id="nb" rows="2" style="width:100%" placeholder="Message"></textarea><button class="p" id="na">Add</button>
  ${notices.map(n=>`<div class="s">${n.date_from}→${n.date_to} ${esc(n.body)} <button data-dn="${n.id}">✕</button></div>`).join('')}</div>
  <div class="row"><h3>Add employee</h3><div class="bar"><input id="fn" placeholder="Full name"><input id="sn" placeholder="Short name on daily roster"><input id="et" placeholder="Team" value="Cricket"><button class="p" id="ad">Add</button></div>
  <div class="s">Several short names for one person: separate with commas.</div><h3>Add many</h3><textarea id="ne" rows="3" style="width:100%" placeholder="One per line: Full name | Short name | Team"></textarea><button class="p" id="ae">Add all</button>
  ${emps.map(e=>`<div class="s">${esc(e.name)} (${esc(e.short_name||'no short name')}) · ${esc(e.team)} · <select data-r="${e.id}">${['employee','lead','admin'].map(r=>`<option ${r===e.role?'selected':''}>${r}</option>`).join('')}</select></div>`).join('')}</div>`}
function match(raw){ // exact short name first, then fall back to guessing "Akash K" style names
  const k=raw.toLowerCase().replace(/[.()]/g,'').replace(/\s+/g,' ').trim();if(!k)return null;
  const ex=emps.filter(e=>(e.short_name||'').split(',').some(x=>x.toLowerCase().replace(/[.()]/g,'').replace(/\s+/g,' ').trim()===k));if(ex.length===1)return ex[0];
  const w=k.split(' ');
  const c=emps.filter(e=>{const p=e.name.toLowerCase().split(/\s+/);return p[0]===w[0]&&(!w[1]||(p[1]||'').startsWith(w[1]))});return c.length===1?c[0]:null}
const tmin=v=>typeof v==='number'?Math.round((v%1)*1440):(m=>m?+m[1]*60+ +m[2]:null)(String(v||'').match(/(\d{1,2}):(\d{2})/));
function parse(ws,tn){
  const out=[],unm=new Set();XLSX.utils.sheet_to_json(ws,{header:1,raw:true}).forEach(r=>{
    if(typeof r[0]!=='number'||r[0]<40000)return;const p=XLSX.SSF.parse_date_code(r[0]),d=p.y+'-'+pad(p.m)+'-'+pad(p.d);
    const ser=String(r[3]||'').trim(),sl=ser.toLowerCase();let kind='match',who=r[6];
    if(String(r[1]).toLowerCase()==='leave'){kind='leave';who=r[2]}else if(sl==='normal'){kind='normal';who=r[4]}else if(sl==='qc'){kind='qc'}
    else if(!ser||['note','client support'].includes(sl)||sl.startsWith('ensure'))return;
    if(!who)return;const rep=String(r[2]||''),ts=(rep.match(/\d{1,2}:\d{2}/g)||[]);
    let s=ts.length?tmin(ts[0]):tmin(r[1]),e=ts.length>1&&/to/i.test(rep)?tmin(ts[1]):null;
    if(s==null&&kind!=='leave')return;if(e==null&&s!=null)e=s+SHIFT_LEN;if(e!=null&&e<s)e+=1440;
    String(who).split(/[,/&;\n]| and /i).map(x=>x.trim()).filter(Boolean).forEach(n=>{const m=match(n);if(!m)unm.add(n);
      out.push({team:tn,d,person_raw:n,employee_id:m?.id||null,kind,series:ser,match_time:String(r[1]??'').slice(0,20),reporting:rep,work_from:r[9]||'',comment:r[7]||'',start_min:kind==='leave'?null:s,end_min:kind==='leave'?null:e})})});
  return {out,unm:[...unm]};
}
function wireManage(){
  $('fl').onchange=async e=>{const wb=XLSX.read(await e.target.files[0].arrayBuffer());const ws=wb.Sheets[wb.SheetNames.find(n=>/oct/i.test(n))||wb.SheetNames[0]];
    prev=parse(ws,$('tn').value.trim()||'Cricket');const ds=[...new Set(prev.out.map(r=>r.d))].sort();
    $('pv2').innerHTML=`Sheet: ${esc(wb.SheetNames.join(', '))}<br>${ds.length} dates (${ds[0]||'-'} → ${ds[ds.length-1]||'-'}), ${prev.out.length} assignments.<br>${prev.unm.length?'⚠ Unmatched names: '+esc(prev.unm.join(', '))+' (add them under Add employees, then re-upload)':'All names matched.'}`;$('sv').disabled=!prev.out.length};
  $('sv').onclick=async()=>{const ds=[...new Set(prev.out.map(r=>r.d))],tn=prev.out[0].team,nots=$('nn').checked?buildNotifs(rows.filter(r=>r.team===tn&&ds.includes(r.d)),prev.out,ds,tn):[];
    let x=await sb.from('assignments').delete().eq('team',tn).in('d',ds);if(x.error)return err(x.error.message);
    for(let i=0;i<prev.out.length;i+=400){x=await sb.from('assignments').insert(prev.out.slice(i,i+400));if(x.error)return err(x.error.message)}
    if(nots.length){x=await sb.from('notifications').insert(nots);if(x.error)return err(x.error.message)}
    prev=null;tab='day';day=ds[0];load()};
  $('na').onclick=async()=>{if(!$('nf').value||!$('nt').value||!$('nb').value)return;await sb.from('notices').insert({date_from:$('nf').value,date_to:$('nt').value,team:$('nteam').value||null,body:$('nb').value,urgent:$('nu').checked});load()};
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=async()=>{await sb.from('notices').delete().eq('id',b.dataset.dn);load()});
  $('ad').onclick=async()=>{if(!$('fn').value.trim())return;const x=await sb.from('employees').insert({name:$('fn').value.trim(),short_name:$('sn').value.trim()||null,team:$('et').value.trim()||'Cricket'});if(x.error)return err(x.error.message);const {data}=await sb.from('employees').select('*').order('name');emps=data;render()};
  $('ae').onclick=async()=>{const r=$('ne').value.split('\n').map(l=>l.split(/\||\t/)).filter(a=>a[0].trim()).map(a=>({name:a[0].trim(),short_name:(a[1]||'').trim()||null,team:(a[2]||'Cricket').trim()}));
    const x=await sb.from('employees').insert(r);if(x.error)return err(x.error.message);const {data}=await sb.from('employees').select('*').order('name');emps=data;render()};
  document.querySelectorAll('[data-r]').forEach(s=>s.onchange=async()=>{if(me.role!=='admin')return err('Only an admin can change roles.');await sb.from('employees').update({role:s.value}).eq('id',s.dataset.r)});
}
const myN=()=>notifs.filter(x=>x.employee_id===me.id||(!x.employee_id&&(!x.team||x.team===me.team)));
const unread=()=>myN().filter(x=>new Date(x.created_at)>new Date(localStorage.seen||0)).length;
const wd=d=>new Date(d+'T00:00').toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
function bellPanel(){const l=myN(),seen=new Date(localStorage.seen||0);
  $('modal').innerHTML=`<div class="mod"><div class="box" style="max-height:80vh;overflow:auto"><h3>Notifications</h3>${l.map(x=>`<div class="row ${new Date(x.created_at)>seen?'me':''}"><b>${esc(x.title)}</b><div class="s">${esc(x.body)} · ${new Date(x.created_at).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="s">Nothing yet.</div>'}<button class="p" id="cl">Close</button></div></div>`;
  $('cl').onclick=()=>{localStorage.seen=new Date().toISOString();$('modal').innerHTML='';render()}}
const unreadPopup=()=>{if(unread())bellPanel();else $('modal').innerHTML=''};
function nextBanner(all){if(tab==='mng')return'';const n=all.filter(p=>p.emp===me.id&&p.d>=TODAY()&&p.s!=null).sort((a,b)=>a.d.localeCompare(b.d))[0];
  return n?`<div class="row me"><b>Your next shift</b><div>${wd(n.d)} · Shift ${n.shift} · ${hm(n.s)}–${hm(n.e)}</div></div>`:'<div class="row s">No upcoming shift found for you yet.</div>'}
function pmap(list){const m={};list.forEach(r=>{if(!r.employee_id)return;const o=m[r.employee_id+'|'+r.d]=m[r.employee_id+'|'+r.d]||{s:null,e:null,leave:false,ser:[]};
  if(r.kind==='leave'){o.leave=true;return}if(r.start_min==null)return;o.s=o.s==null?r.start_min:Math.min(o.s,r.start_min);o.e=o.e==null?r.end_min:Math.max(o.e,r.end_min);o.ser.push(r.series)});
  Object.values(m).forEach(o=>o.shift=o.s==null?0:o.s<420?1:o.e>1440?3:2);return m}
const desc=o=>!o?'not rostered':o.s==null?'Leave':`Shift ${o.shift} ${hm(o.s)}–${hm(o.e)}`+(o.ser[0]?' ('+o.ser[0]+')':'');
function buildNotifs(old,nw,ds,tn){const A=pmap(old),B=pmap(nw),oldD=new Set(old.map(r=>r.d)),out=[],ch=new Set();
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{const a=A[k],b=B[k],[e,d]=k.split('|');if(desc(a)===desc(b))return;if(oldD.has(d))ch.add(d);
    out.push({employee_id:e,team:tn,title:(!a?(b.s==null?'Leave: ':'New shift: '):!b?'Removed from roster: ':'Shift changed: ')+wd(d),body:!a?desc(b):!b?'You are no longer rostered on this day.':desc(a)+' → '+desc(b)})});
  const nd=ds.filter(d=>!oldD.has(d)).sort(),cd=[...ch].sort();
  if(nd.length)out.push({team:tn,title:'Roster published',body:`${tn}: ${nd[0]}${nd.length>1?' to '+nd[nd.length-1]:''}. See My shifts.`});
  if(cd.length)out.push({team:tn,title:'Roster updated',body:`${tn}: changes on ${cd.join(', ')}. Affected people also get their own notification.`});
